<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>E-Kitab At-Tartil | TPQ AMANAH</title>
  <link rel="shortcut icon" href="img/og.png" type="image/x-icon" />
  <meta name="description"
    content="E-Kitab At-Tartil Jilid 1-6 - Belajar mengaji dengan metode At-Tartil. TPQ AMANAH Sawotratap, Gedangan, Sidoarjo." />
  <meta name="author" content="Riski Putra Alamzah" />
  <meta name="keywords" content="At-Tartil, Al-Qur'an, Materi, Belajar, TPQ AMANAH, Mengaji" />
  <meta name="theme-color" content="#1B5E20" />

  <!-- OpenGraph -->
  <meta property="og:title" content="E-Kitab At-Tartil | TPQ AMANAH" />
  <meta property="og:description" content="E-Kitab At-Tartil Jilid 1-6 - Belajar mengaji dengan metode At-Tartil" />
  <meta property="og:image" content="https://at-tartil.riskiputraalamzah.my.id/img/og.png" />
  <meta property="og:url" content="https://at-tartil.riskiputraalamzah.my.id/" />
  <meta property="og:type" content="website" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- App Container -->
  <div id="app">

    <!-- Book Selection View -->
    <div id="bookSelection" class="view-selection">
      <!-- Header -->
      <header class="selection-header">
        <div class="header-brand">
          <img src="img/logo.webp" alt="Logo" class="brand-logo" width="48" height="48" />
          <div class="brand-text">
            <h1>E-Kitab At-Tartil</h1>
            <span>TPQ AMANAH Sawotratap</span>
          </div>
        </div>
        <a href="https://tpq-amanah.vercel.app/" class="btn-home" target="_blank" rel="noopener"
          title="Kembali ke Website TPQ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <polyline points="9,22 9,12 15,12 15,22" />
          </svg>
          <span>Website TPQ</span>
        </a>
      </header>

      <!-- Book Grid -->
      <main class="selection-main">
        <div class="selection-title">
          <h2>Pilih Jilid At-Tartil</h2>
          <p>Klik salah satu kitab untuk mulai membaca</p>
        </div>

        <div class="books-grid">
          <button class="book-item" onclick="openBook(1)" aria-label="Buka At-Tartil Jilid 1">
            <div class="book-3d">
              <div class="book-spine"></div>
              <div class="book-cover-wrap">
                <img src="img/tartil1/cover.webp" alt="At-Tartil Jilid 1" loading="lazy" />
              </div>
            </div>
            <span class="book-label">Jilid 1</span>
          </button>

          <button class="book-item" onclick="openBook(2)" aria-label="Buka At-Tartil Jilid 2">
            <div class="book-3d">
              <div class="book-spine"></div>
              <div class="book-cover-wrap">
                <img src="img/tartil2/cover.webp" alt="At-Tartil Jilid 2" loading="lazy" />
              </div>
            </div>
            <span class="book-label">Jilid 2</span>
          </button>

          <button class="book-item" onclick="openBook(3)" aria-label="Buka At-Tartil Jilid 3">
            <div class="book-3d">
              <div class="book-spine"></div>
              <div class="book-cover-wrap">
                <img src="img/tartil3/cover.webp" alt="At-Tartil Jilid 3" loading="lazy" />
              </div>
            </div>
            <span class="book-label">Jilid 3</span>
          </button>

          <button class="book-item" onclick="openBook(4)" aria-label="Buka At-Tartil Jilid 4">
            <div class="book-3d">
              <div class="book-spine"></div>
              <div class="book-cover-wrap">
                <img src="img/tartil4/cover.webp" alt="At-Tartil Jilid 4" loading="lazy" />
              </div>
            </div>
            <span class="book-label">Jilid 4</span>
          </button>

          <button class="book-item" onclick="openBook(5)" aria-label="Buka At-Tartil Jilid 5">
            <div class="book-3d">
              <div class="book-spine"></div>
              <div class="book-cover-wrap">
                <img src="img/tartil5/cover.webp" alt="At-Tartil Jilid 5" loading="lazy" />
              </div>
            </div>
            <span class="book-label">Jilid 5</span>
          </button>

          <button class="book-item" onclick="openBook(6)" aria-label="Buka At-Tartil Jilid 6">
            <div class="book-3d">
              <div class="book-spine"></div>
              <div class="book-cover-wrap">
                <img src="img/tartil6/cover.webp" alt="At-Tartil Jilid 6" loading="lazy" />
              </div>
            </div>
            <span class="book-label">Jilid 6</span>
          </button>
        </div>
      </main>

      <!-- Footer -->
      <footer class="selection-footer">
        <p>© <span id="year"></span> E-Kitab At-Tartil - TPQ AMANAH</p>
        <p>Created with ❤️ by <a href="https://riskiputraalamzah.my.id" target="_blank" rel="noopener">Riski Putra
            Alamzah</a></p>
      </footer>
    </div>

    <!-- Flipbook Reader View -->
    <div id="flipbookReader" class="view-reader hidden">
      <!-- Top Toolbar -->
      <header class="reader-toolbar">
        <button class="toolbar-btn" onclick="closeBook()" title="Kembali">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>

        <div class="toolbar-center">
          <span class="toolbar-title" id="toolbarTitle">At-Tartil Jilid 1</span>
          <span class="toolbar-page" id="toolbarPage">Halaman 1 / 36</span>
        </div>

        <div class="toolbar-actions">
          <button class="toolbar-btn" onclick="toggleFullscreen()" id="fullscreenBtn" title="Layar Penuh">
            <svg id="iconExpand" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3" />
            </svg>
            <svg id="iconCompress" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M8 3v3a2 2 0 01-2 2H3m18 0h-3a2 2 0 01-2-2V3m0 18v-3a2 2 0 012-2h3M3 16h3a2 2 0 012 2v3" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Reader Area -->
      <main class="reader-main">
        <!-- Navigation: Previous -->
        <button class="nav-arrow nav-prev" onclick="flipPrev()" id="navPrev" title="Sebelumnya">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>

        <!-- Cover View (Centered Single Cover) -->
        <div id="coverView" class="cover-view">
          <div class="cover-wrapper">
            <img id="coverImage" src="" alt="Cover" class="cover-image" />
            <button class="start-reading-btn" onclick="startReading()">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 3l14 9-14 9V3z" />
              </svg>
              Mulai Baca
            </button>
          </div>
        </div>

        <!-- Flipbook Container (Hidden until reading) -->
        <div id="flipbookContainer" class="flipbook-wrapper hidden">
          <div id="flipbook" class="flipbook"></div>
        </div>

        <!-- Navigation: Next -->
        <button class="nav-arrow nav-next" onclick="flipNext()" id="navNext" title="Berikutnya">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
      </main>

      <!-- Bottom Bar -->
      <footer class="reader-footer">
        <button class="footer-btn" onclick="flipToPage(0)" title="Cover">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" />
          </svg>
          <span>Cover</span>
        </button>

        <div class="page-nav">
          <label for="pageSelect">Halaman:</label>
          <select id="pageSelect" onchange="flipToPage(parseInt(this.value))">
            <option value="0">Cover</option>
          </select>
        </div>

        <!-- Mobile Navigation -->
        <div class="mobile-nav">
          <button class="footer-btn" onclick="flipPrev()" id="mobilePrev">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6" />
            </svg>
            <span>Prev</span>
          </button>
          <button class="footer-btn" onclick="flipNext()" id="mobileNext">
            <span>Next</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18l6-6-6-6" />
            </svg>
          </button>
        </div>
      </footer>
    </div>

  </div>

  <!-- PageFlip Library -->
  <script src="js/page-flip.browser.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
